[project]
name = "bobby-hedgefund"
version = "0.1.0"
description = "Paper-money biotech fund run by LLM agents. So far: the day-1 archive of public files that are overwritten daily."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
bobby-archive = "bobby_hedgefund.archive.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]
ignore = ["PTH123"]  # open() is fine next to Path

[tool.pyright]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
