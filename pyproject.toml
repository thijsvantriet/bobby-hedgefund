[project]
name = "bobby-hedgefund"
version = "0.1.0"
description = "Paper-money biotech fund run by LLM agents. So far: the archive of public files and the data streams: prices, universe, SEC filings, trial-record changes."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
bobby-archive = "bobby_hedgefund.archive.cli:main"
bobby-filings = "bobby_hedgefund.filings.cli:main"
bobby-prices = "bobby_hedgefund.prices.cli:main"
bobby-trials = "bobby_hedgefund.trials.cli:main"
bobby-universe = "bobby_hedgefund.universe.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]
ignore = ["PTH123"]  # open() is fine next to Path

[tool.pyright]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
